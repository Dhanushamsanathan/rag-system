name: CI Pipeline - Tests, Lint & Retrieval Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with Ruff
      run: |
        ruff check . --select=E9,F63,F7,F82 --show-source

    - name: Run Unit Tests with Coverage
      run: |
        PYTHONPATH=. pytest tests/ -v --cov=. --cov-report=term-missing:skip-covered

    - name: Run Retrieval Benchmark Evaluation
      run: |
        PYTHONPATH=. python eval/evaluate_retrieval.py

    - name: Validate Docker Build
      run: |
        docker build -t rfp-platform:ci .
