name: CI Pipeline - Tests & Retrieval Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_evaluate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        PYTHONPATH=. pytest tests/ -v

    - name: Run Retrieval Benchmark Evaluation
      run: |
        PYTHONPATH=. python eval/evaluate_retrieval.py
