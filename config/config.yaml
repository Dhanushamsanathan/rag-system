# Configuration for RFP Intelligence Platform: RAG & Multi-Agent System

embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  batch_size: 32
  normalize: true

chunking:
  chunk_size: 600
  chunk_overlap: 120
  min_chunk_length: 50

retrieval:
  top_k: 5
  dense_weight: 0.5
  sparse_weight: 0.5
  rrf_k: 60
  enable_reranker: true
  enable_query_expansion: true
  reranker_model: "BAAI/bge-reranker-base"

agent:
  max_retries: 2
  confidence_threshold: 0.70
  strict_citations: true
  enable_feedback_loop: true
  observability_log: true

llm:
  provider: "auto" # "auto", "gemini", "openai", "anthropic", "ollama", "fallback"
  gemini_model: "gemini-2.0-flash"
  openai_model: "gpt-4o"
  anthropic_model: "claude-3-5-sonnet-20241022"
  temperature: 0.1
  max_tokens: 1500

storage:
  index_dir: "./index_storage"
  output_dir: "./output"
